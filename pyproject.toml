[project]
name = "mas-gke"
version = "0.1.0"
description = "Multi-agent system for GKE — an A2A orchestrator + specialist workers"
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "injector>=0.22",
    "loguru>=0.7",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
    "opentelemetry-instrumentation-httpx>=0.40b0",
    "cloudpathlib[gs,s3]>=0.20",
    "google-cloud-logging>=3.12.0,<4.0.0",
    # Deliberately WITHOUT the [evaluation] extra. That extra is an
    # evaluation-time dependency -- it pulls litellm, scipy, scikit-learn,
    # pandas and openai, ~220 MB of the runtime image -- and nothing under app/
    # imports any of it. The `eval` optional group below still asks for it, so
    # `agents-cli eval` is unaffected; the agents' container is not.
    "google-cloud-aiplatform>=1.156.0",
    # The trades agent queries BigQuery. It already arrives transitively via
    # google-cloud-aiplatform, but a module that imports a package should be
    # the reason that package is installed.
    "google-cloud-bigquery>=3.34.0,<4.0.0",
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn~=0.34.0",
    "asyncpg>=0.30.0,<1.0.0",
    "sqlalchemy>=2,<3",
    "python-multipart>=0.0.20,<1.0.0",
    # >=2.5.0 is the A2A v1.0 floor, not a preference. google/adk/a2a/_compat.py
    # -- the shim whose IS_A2A_V1 branch drives every ADK<->a2a call -- first
    # ships in 2.5.0. On 2.4.0 and older, ADK builds 0.3-shaped Parts and agent
    # cards against a 1.x SDK, which fails at request time rather than at import.
    "google-adk[db,gcp,otel-gcp]>=2.5.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    # A2A protocol v1.0. The 1.x line is a hard break from 0.3.x: protobuf types
    # instead of pydantic, SCREAMING_SNAKE_CASE enums, unified Part, and route
    # factories in place of the removed a2a.server.apps wrappers. See
    # docs/a2a-v1-migration.md.
    "a2a-sdk[http-server]>=1.1.2,<2.0.0",
    "aiohttp>=3.13.4",
    "alembic>=1.18.5",
    "google-cloud-alloydb-connector[asyncpg]>=1.13.1",
    "greenlet>=3.5.4",
]
requires-python = ">=3.14,<3.15"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "basedpyright>=1.39.9",
    "ty>=0.0.65",
    "ruff>=0.16.1",
    "codespell>=2.4.3",
    "nodejs-wheel-binaries>=24.16.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
    # Editor LSP (nvim) + a second opinion alongside ty. NOT run by
    # `agents-cli lint`, but it must be installed for the LSP to start, so keep
    # it here with the other linters. Policy lives in the root
    # pyrightconfig.json, which takes precedence over any [tool.basedpyright]
    # section here.
    "basedpyright>=1.31",
]

# NOTE: there are deliberately no [tool.ruff] or [tool.ty] sections here.
# The standalone ruff.toml and ty.toml at the repo root take precedence over
# them, so anything written here would be dead config that silently contradicts
# the real policy — and ty warns on every run when it has to ignore such a
# section. Lint/type-check settings belong in those two files (and
# pyrightconfig.json for basedpyright). See AGENTS.md "Code style".

[tool.codespell]
# "notin" is the Kubernetes label-selector operator `NotIn`; "zar" is the
# ISO-4217 code for the South African rand (app/agents/currency/tools.py).
ignore-words-list = "rouge,notin,zar"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


