apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app: orchestrator
    app.kubernetes.io/component: orchestrator
spec:
  # Safe to scale. HITL used to pin this to one replica; it no longer does.
  # Approvals live in AlloyDB (migration 0004), a paused invocation is rebuilt
  # from the session rather than held in memory, the claim is a single
  # conditional UPDATE so two deciders cannot both win, and an in-flight resume
  # heartbeats its lease so no peer's sweep can take it. Verified in-cluster at
  # 2 replicas: a pause raised on one pod resumed when the decision arrived at
  # the other, and a dead owner's work was recovered by a live peer within
  # HITL_LEASE_TTL_SECONDS, with no restart (docs/plans/hitl/results.md R11).
  #
  # Kept at 1 as a cost default, not a correctness one. Scaling does still need
  # a database: with DB_BACKEND=none the store is per-pod memory again.
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      # This agent's own ServiceAccount (see serviceaccounts.yaml). Bound by
      # Workload Identity to its own GSA, which maps to its own AlloyDB IAM
      # role, which is granted on its own PostgreSQL schema.
      serviceAccountName: agent-orchestrator
      containers:
        - name: agent
          # Placeholder image name; the overlay rewrites it to your Artifact
          # Registry path via the kustomize `images:` transformer.
          image: agent-image
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: agent-config
          env:
            - name: AGENT_NAME
              value: orchestrator
            # The AlloyDB IAM database role this pod authenticates as: its GSA
            # email minus the ".gserviceaccount.com" suffix, the form AlloyDB
            # uses for service-account IAM users. Must match the ServiceAccount
            # annotation above.
            #   terraform output -json agent_database_roles
            # DB_SCHEMA is intentionally unset; it defaults to AGENT_NAME.
            - name: ALLOYDB_IAM_USER
              value: agent-orchestrator@msteiner.iam
            # APP_URL is the base URL this agent advertises in its A2A agent
            # card (the card's `url`, which peers use to reach its JSON-RPC
            # endpoint at APP_URL + /a2a/app). Without it the card defaults to
            # http://0.0.0.0:8000, which is unreachable from other pods. It MUST
            # equal how peers address this Service, i.e.
            # http://<service-name>.<A2A_NAMESPACE>.<A2A_CLUSTER_DOMAIN>.
            - name: APP_URL
              value: http://orchestrator.agents.svc.cluster.local
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels:
    app: orchestrator
spec:
  # ClusterIP by default. To reach the orchestrator externally, switch to
  # type: LoadBalancer or front it with an Ingress/Gateway. For a quick test:
  #   kubectl -n agents port-forward svc/orchestrator 8080:80
  type: ClusterIP
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 80
      targetPort: 8080
