apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources land in the `agents` namespace (matches A2A_NAMESPACE and the
# Terraform Workload Identity binding).
namespace: agents

resources:
  - namespace.yaml
  # One ServiceAccount per agent, plus the migrator. Replaces the former single
  # `agent` ServiceAccount -- see the IDENTITY MODEL note in
  # ../../terraform/main.tf.
  - serviceaccounts.yaml
  - configmap.yaml
  # Restricts A2A traffic to the delegation graph declared in AgentSpec.peers.
  # Enforced natively by GKE Autopilot (Dataplane V2).
  - networkpolicy.yaml
  # Alembic Job. Let it complete before the agents come up; see the ORDERING
  # note in migrate-job.yaml.
  - migrate-job.yaml
  - orchestrator.yaml
  - workers.yaml

# Apply a shared label to all resources WITHOUT mutating (immutable) selectors.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: multi-agent-system
