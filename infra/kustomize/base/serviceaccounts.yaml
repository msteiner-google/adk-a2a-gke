# One Kubernetes ServiceAccount per agent, plus one for the schema migrator.
#
# This replaces the former single `agent` ServiceAccount. Each KSA is bound by
# Workload Identity to its OWN Google Service Account, which in turn maps to its
# OWN AlloyDB IAM database role, which is granted on its OWN PostgreSQL schema.
# That chain is what makes the per-agent schema split an enforced boundary
# rather than a naming convention -- see the IDENTITY MODEL comment in
# ../../terraform/main.tf.
#
# The KSA name must match `${service_account_prefix}-${agent}` in Terraform
# (default prefix "agent"), because the Workload Identity binding names the pair
# `<namespace>/<ksa>` explicitly.
#
# After `terraform apply`, fill in the annotations from:
#   terraform output -json kustomize_values | jq .service_account_annotations
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-orchestrator
  labels:
    app.kubernetes.io/component: orchestrator
  annotations:
    iam.gke.io/gcp-service-account: agent-orchestrator@msteiner.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-research
  labels:
    app.kubernetes.io/component: specialist
  annotations:
    iam.gke.io/gcp-service-account: agent-research@msteiner.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-math
  labels:
    app.kubernetes.io/component: specialist
  annotations:
    iam.gke.io/gcp-service-account: agent-math@msteiner.iam.gserviceaccount.com
---
# The trades agent is the reason per-agent identities are worth the trouble.
# It is the only one that needs roles/bigquery.jobUser, and it gets it through
# var.agent_extra_iam_roles rather than the shared baseline -- so the ability to
# run a BigQuery job stops at this pod instead of being handed to `research`,
# which ingests untrusted web content.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-trades
  labels:
    app.kubernetes.io/component: specialist
  annotations:
    iam.gke.io/gcp-service-account: agent-trades@msteiner.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-currency
  labels:
    app.kubernetes.io/component: specialist
  annotations:
    iam.gke.io/gcp-service-account: agent-currency@msteiner.iam.gserviceaccount.com
---
# The migrator is the ONLY identity with DDL rights on the database. It is used
# by a Job, never by a long-running agent, so no model-driven code path ever
# holds privileges that can alter the schema.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-migrator
  labels:
    app.kubernetes.io/component: migration
  annotations:
    iam.gke.io/gcp-service-account: agent-migrator@msteiner.iam.gserviceaccount.com
