# Ruff config for this repo — the single source of truth for lint/format rules.
#
# It lives here rather than in a [tool.ruff] section of pyproject.toml because a
# standalone ruff.toml takes precedence over that section (verified), so keeping
# both would mean one of them silently loses. Run it with `agents-cli lint`.
#
# The policy is deliberately strict: line length is enforced, mutable-default-arg
# bugs are caught, and docstrings are required on the code we write. The
# low-level serving plumbing is exempted below.

line-length = 88
# This project pins ONE Python version rather than supporting a range:
# requires-python is `>=3.14,<3.15`, the Dockerfile is `python:3.14-slim`, and
# the dev venv is 3.14. So `target-version` is not a floor to be conservative
# about — it is the exact interpreter that runs everywhere, and pyupgrade is
# free to rewrite to full 3.14 syntax.
#
# Keep this in lockstep with requires-python (pyproject.toml), the Dockerfile,
# ty.toml and pyrightconfig.json. tests/unit/test_python_version.py enforces it.
target-version = "py314"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (likely bugs, e.g. mutable defaults)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern syntax)
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "D",    # pydocstyle (docstrings)
    "PTH",  # prefer pathlib over os.path
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "TID",  # tidy imports
]
ignore = [
    # These two D rules are mutually exclusive with the ones we keep; picking a
    # side avoids ruff warning about the conflict.
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["app", "frontend"]

[lint.per-file-ignores]
# Low-level serving/A2A plumbing: stable boilerplate we rarely touch, so it is
# not held to the strict docstring/style/pathlib rules.
"app/app_utils/**" = ["D", "ARG", "N", "PTH"]
# app/shared is deliberately kept portable to Python 3.11 so it can be reused by
# other services, so it imports `override` from typing_extensions rather than
# typing. UP035 would "fix" that and break the portability guarantee, so the
# rule is off for that package only.
"app/shared/**" = ["UP035"]
"app/fast_api_app.py" = ["D", "PTH"]
# Tests favor readability over docstring coverage and unused-arg purity.
# Match at any depth so both tests/** and the tests that live inside the shared
# library (app/shared/tests/**) are covered.
# TID252: the shared library's tests use parent-relative imports on purpose so
# they resolve the same way wherever the package is dropped in.
"**/tests/**" = ["D", "ARG", "TID252"]
