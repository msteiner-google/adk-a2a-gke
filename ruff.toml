# Team ruff config for projects scaffolded from this template.
#
# A standalone ruff.toml takes precedence over the base template's
# [tool.ruff] section in pyproject.toml (verified), so this file is the single
# source of truth for lint/format rules. Run it with `agents-cli lint`.
#
# This is intentionally STRICTER than the scaffolder's defaults: line length is
# enforced, mutable-default-arg bugs are caught, and docstrings are required on
# the code you write. Generated infrastructure we don't own is exempted below.

line-length = 88
# This project pins ONE Python version rather than supporting a range:
# requires-python is `>=3.14,<3.15`, the Dockerfile is `python:3.14-slim`, and
# the dev venv is 3.14. So `target-version` is not a floor to be conservative
# about — it is the exact interpreter that runs everywhere, and pyupgrade is
# free to rewrite to full 3.14 syntax.
#
# Keep this in lockstep with requires-python (pyproject.toml), the Dockerfile,
# ty.toml and pyrightconfig.json. tests/unit/test_python_version.py enforces it.
target-version = "py314"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (likely bugs, e.g. mutable defaults)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern syntax)
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "D",    # pydocstyle (docstrings)
    "PTH",  # prefer pathlib over os.path
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "TID",  # tidy imports
]
ignore = [
    # These two D rules are mutually exclusive with the ones we keep; picking a
    # side avoids ruff warning about the conflict.
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["app", "frontend"]

[lint.per-file-ignores]
# Generated serving/A2A infrastructure is owned by the base template, not by
# app authors — don't hold it to the strict docstring/style/pathlib rules.
"app/app_utils/**" = ["D", "ARG", "N", "PTH"]
# The upstream shared library still supports Python 3.11 (this project pins
# 3.14), so it imports `override` from typing_extensions rather than typing.
# That is correct for upstream and wrong by UP035's reckoning here. Exempting
# the rule is deliberate: "fixing" it locally would be reverted by the next
# `agents-cli scaffold upgrade` and break lint again on every upgrade.
"app/shared/**" = ["UP035"]
"app/fast_api_app.py" = ["D", "PTH"]
# Tests favor readability over docstring coverage and unused-arg purity.
# Match at any depth so both the base-template tests (tests/**) and the tests
# shipped inside the shared library (app/shared/tests/**) are covered.
# TID252: the shipped shared tests use parent-relative imports on purpose so
# they resolve as `app.shared.tests` here and `shared.tests` in the dev harness.
"**/tests/**" = ["D", "ARG", "TID252"]
