# Alembic configuration for the multi-agent system's AlloyDB schema.
#
# This file deliberately lives under app/ rather than at the repository root:
# the Dockerfile copies only ./app into the image, so migrations kept anywhere
# else would be invisible to the migration Job -- which has to run the exact
# same image as the agents.
#
# There is NO sqlalchemy.url here on purpose. The connection is built by env.py
# from the same DB_* environment variables the agents use, so migrations
# authenticate to AlloyDB with IAM through the AlloyDB connector -- no password
# and no DSN to keep in sync. See app/cluster/db.py.
#
# Usage:
#   uv run alembic -c app/migrations/alembic.ini -x schema=research upgrade head
#
# The -x schema=<name> argument selects which per-agent PostgreSQL schema to
# migrate; it falls back to DB_SCHEMA and then AGENT_NAME. Each schema keeps its
# own alembic_version table, so agents are versioned independently.

[alembic]
# Resolve the migration tree relative to this file, not the caller's cwd.
script_location = %(here)s
prepend_sys_path = .
path_separator = os

# Timestamped, slug-prefixed revision filenames so history reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Keep generated revisions consistent with the repo's ruff config.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
