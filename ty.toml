# ty (Astral type checker) config for this repo.
#
# It lives here rather than in a [tool.ty] section of pyproject.toml because a
# standalone ty.toml takes precedence over that section (per
# https://docs.astral.sh/ty/configuration/), so keeping both would mean one of
# them silently loses. Run it with `agents-cli lint` (or `agents-cli lint
# --skip-ty` to skip).
#
# The policy is deliberately strict: we keep only the noise-reduction needed for
# third-party/dynamic code (unresolved imports/attributes) and let ty flag real
# type errors (bad arguments, returns, assignments) instead of ignoring
# everything.

[environment]
# This project pins ONE Python version rather than supporting a range:
# requires-python is `>=3.14,<3.15`, the Dockerfile is `python:3.14-slim`, and
# the dev venv is 3.14. There is no older interpreter to stay compatible with,
# so the full 3.14 stdlib and syntax are fair game.
#
# Keep this in lockstep with requires-python (pyproject.toml), the Dockerfile,
# ruff.toml and pyrightconfig.json. tests/unit/test_python_version.py enforces it.
python-version = "3.14"

[src]
exclude = [".venv/**", "**/node_modules/**", "frontend/**"]

[rules]
# Third-party libs without stubs and ADK's dynamic surfaces produce a lot of
# these; keep them quiet so signal isn't drowned out.
unresolved-import = "ignore"
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"
# Everything else (invalid-argument-type, invalid-return-type,
# invalid-assignment, etc.) stays at ty's default severity so genuine type
# errors surface.
